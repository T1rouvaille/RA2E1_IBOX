# Peripheral conig for project
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_PINCTRL=y
CONFIG_PWM=y

# choose RTT console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# Datalogging configrations
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# KL Turn off debugging in kernel
CONFIG_NVS=y
CONFIG_LOG=n
CONFIG_NVS_LOG_LEVEL_DBG=n
CONFIG_REBOOT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y


# enable async uart
CONFIG_UART_ASYNC_API=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y  

# Enable Thrad Monitor
CONFIG_THREAD_MONITOR=n

# Enable the BLE stack with GATT Client configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y

# Enable the BLE modules from NCS
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_MANUFACTURER_DATA_CNT=1
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_GATT_DM=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# This example requires more workqueue stack

CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_PRIVACY=n

# Enable bonding
CONFIG_BT_SETTINGS=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y


#Configration for increased power
CONFIG_BT_CTLR=y
CONFIG_BT_HCI=y
CONFIG_BT_LL_SW_SPLIT=n
# CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_RSSI=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_BT_LL_SOFTDEVICE=y

#Configration to stop idle thread to run 
CONFIG_IDLE_STACK_SIZE= 2048 

#Configratoin for ADC
CONFIG_ADC=y

#Configration for Watchdog
CONFIG_WATCHDOG=y

#Configration to remove the boot banner
CONFIG_BOOT_BANNER=n

#Configration to get PM_device
CONFIG_PM=y
CONFIG_PM_DEVICE=y

#Configration for I2C 
CONFIG_I2C=y
CONFIG_NEWLIB_LIBC=y


#Coded PHY
CONFIG_BT_CTLR_PHY_CODED=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

CONFIG_BT_HCI_VS=y
CONFIG_BT_HCI_VS_EXT=y

CONFIG_ASSERT=y

CONFIG_NRFX_POWER=y

CONFIG_FPU=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y